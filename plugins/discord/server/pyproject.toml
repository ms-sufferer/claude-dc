[project]
name = "mcp-discord"
version = "0.1.0"
description = "Discord integration for Model Context Protocol (read-only fork)"
authors = [
    {name = "Hanweg Altimer", email = "hanwegaltimer@outlook.com"},
]
dependencies = [
    "discord.py>=2.3.0",
    # mcp 2.x usunelo API dekoratorow (Server.list_tools), na ktorym opiera sie ten kod.
    "mcp>=1.1,<2",
    # Python 3.13 usunal modul audioop, ktorego wymaga discord.py.
    "audioop-lts; python_version >= '3.13'",
]
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.urls]
Upstream = "https://github.com/hanweg/mcp-discord"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_mcp"]

[project.scripts]
mcp-discord = "discord_mcp:main"
